name: Verify and build Windows
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
  workflow_dispatch:
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  installer-ui:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - shell: pwsh
        run: choco install nsis --version=3.11 -y --no-progress
      - name: Compile the real installer pages with an inert tiny payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/Yoru-win32-x64/resources | Out-Null
          Set-Content artifacts/Yoru-win32-x64/Yoru.exe 'Not executable. UI test fixture only.'
          Set-Content artifacts/Yoru-win32-x64/resources/app.asar 'UI test fixture only.'
          node scripts/build-installer.js
      - name: Check Russian buttons, shortcuts and removal quickly
        shell: pwsh
        env:
          YORU_INSTALLER_UI_ONLY: '1'
        run: ./scripts/test-installer.ps1
  windows:
    needs: installer-ui
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run unit tests
        shell: pwsh
        run: |
          & npm test 2>&1 | Tee-Object -Variable unitOutput
          if ($LASTEXITCODE -ne 0) {
            $diagnosis = (($unitOutput | Select-Object -Last 70) -join "`n") -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Host "::error title=Unit test failure::$diagnosis"
            exit 1
          }
      - run: npm run build
      - name: Launch and check the real desktop application
        shell: pwsh
        run: |
          & npm run test:desktop 2>&1 | Tee-Object -Variable desktopOutput
          if ($LASTEXITCODE -ne 0) {
            $diagnosis = (($desktopOutput | Select-Object -Last 45) -join "`n") -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Host "::error title=Desktop test failure::$diagnosis"
            exit 1
          }
      - run: npm run package:win
      - name: Install NSIS compiler
        shell: pwsh
        run: choco install nsis --version=3.11 -y --no-progress
      - name: Build standalone Windows installer
        shell: pwsh
        run: |
          & node scripts/build-installer.js 2>&1 | Tee-Object -Variable compilerOutput
          if ($LASTEXITCODE -ne 0) {
            $diagnosis = (($compilerOutput | Select-Object -Last 16) -join "`n") -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Host "::error title=NSIS build::$diagnosis"
            exit 1
          }
      - name: Install, launch, upgrade and uninstall on Windows
        shell: pwsh
        run: ./scripts/test-installer.ps1
      - name: Archive application
        shell: pwsh
        run: 7z a artifacts/Yoru-windows-x64.zip ./artifacts/Yoru-win32-x64/*
      - uses: actions/upload-artifact@v7
        with:
          name: Yoru-windows-x64
          path: artifacts/Yoru-windows-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: Yoru-installer-x64
          path: |
            artifacts/Yoru-Setup-*-x64.exe
            artifacts/Yoru-Setup-*-x64.exe.sha256
          if-no-files-found: error

  publish:
    needs: windows
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          name: Yoru-installer-x64
          path: release-assets
      - uses: actions/download-artifact@v8
        with:
          name: Yoru-windows-x64
          path: release-assets
      - name: Verify checksums and publish public downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.js
